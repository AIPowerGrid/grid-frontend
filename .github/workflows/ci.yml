name: Console CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint:strict
      - name: Build
        run: pnpm build
      - name: Test canonical account boundary
        run: pnpm test:auth-smoke
      - name: Test key-management proof boundary
        run: pnpm test:key-management
      - name: Test validator account pairing boundary
        run: pnpm test:validator-pairing
